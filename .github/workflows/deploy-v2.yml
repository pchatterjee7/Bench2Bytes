name: Deploy Bench2Bytes V2
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
        working-directory: v2
      - name: Build and verify preserved content
        run: |
          npm run build
          npm run verify
          node scripts/verify-content.mjs
        working-directory: v2
        env:
          SITE_PREVIEW: 'false'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: v2/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
